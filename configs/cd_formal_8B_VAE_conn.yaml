run_name: vae_paper_reproduction

trainer:
  run_name: ${run_name}
  do_train: true
  num_train_epochs: 2
  # With the released 8-GPU launcher this gives the paper's global batch 128.
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  bf16: true
  save_strategy: epoch
  learning_rate: 2e-5
  max_grad_norm: 1.0
  weight_decay: 0.03
  warmup_steps: 1000
  lr_scheduler_type: cosine
  logging_steps: 10
  ddp_backend: nccl
  fsdp: full_shard auto_wrap
  fsdp_config:
    backward_prefetch: backward_pre
    forward_prefetch: true
    cpu_ram_efficient_loading: true
    sync_module_states: true
    transformer_layer_cls_to_wrap:
      - LlamaDecoderLayer
    use_orig_params: true
    activation_checkpointing: true
  report_to: wandb
  output_dir: checkpoints/${run_name}
  dataloader_num_workers: 8
  remove_unused_columns: false
  eval_strategy: "no"

model:
  llm_model_name_or_path: meta-llama/Llama-3.1-8B
  use_flash_attn: true
  freeze_tokenizer: true
  discrete: false
  use_query_embeddings: false
  num_codebooks: 8
  patch_embedding_length: 64
  block: false
  cos_loss: 1.0
  emu2_expr: false
  subsampling: false

ae:
  # The paper fine-tunes all VAE encoder parameters and freezes the decoder.
  use_lora: false
  lora_r: 512
  lora_alpha: 256
  lora_dropout: 0.05
  latent_dim: 512
  fixed_mem_size: 4
  beta: 1e-5
  latent_noise_std: 3.0
  token_substitution_prob: 0.3
  paper_block_mode: true
  mean_compression_rate: 1
  icae_ckpt: "checkpoints/vae_paper/model.safetensors"

  # These affine statistics are not specified in the paper. The values below
  # came with the released downstream configuration and must not be assumed to
  # match a newly trained VAE checkpoint. Measure the new checkpoint's latent
  # distribution before using them in diffusion training.
  scale_factor: 0.2154
  shift_factor: 0.2192

dataset:
  train_file: data/vae_train.jsonl
  val_file: data/vae_val.jsonl
  input_type: cot_only
  answer_prefix: "The answer is"
  require_answer_prefix: true
  preprocessing_num_workers: 16

log_dir: wandb/logs
wandb_dir: wandb
allow_resume: true
