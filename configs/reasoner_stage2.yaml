run_name: ladir-reasoner-stage2
allow_resume: true

model:
  model_name_or_path: meta-llama/Llama-3.1-8B
  torch_dtype: bfloat16
  attn_implementation: eager
  use_fast_tokenizer: false
  stage: 2
  objective: flow
  latent_dim: 512
  latent_tokens_per_block: 4
  num_train_timesteps: 1000
  lambda_flow: 5.0
  lambda_answer: 1.0
  lambda_special: 1.0
  condition_dropout_prob: 0.1
  target_block_sampling: all
  rollout_steps: 10
  rollout_initial_noise_scale: 1.0
  init_from: checkpoints/reasoner_stage1/model.safetensors

data:
  train_manifest: data/reasoner_train/manifest.jsonl
  train_latents: data/reasoner_train/latents.npy
  train_metadata: data/reasoner_train/metadata.json
  validation_manifest: null
  validation_latents: null
  validation_metadata: null
  max_question_length: 1024
  max_answer_length: 512
  max_blocks: null

trainer:
  output_dir: checkpoints/reasoner_stage2
  run_name: ${run_name}
  do_train: true
  num_train_epochs: 20
  per_device_train_batch_size: 1
  # Four GPUs x accumulation 3 gives the paper's global batch 12.
  gradient_accumulation_steps: 3
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  bf16: true
  tf32: true
  logging_steps: 1
  save_strategy: steps
  save_steps: 250
  save_total_limit: 3
  eval_strategy: "no"
  report_to: wandb
  remove_unused_columns: false
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  ddp_backend: nccl
  ddp_find_unused_parameters: false
  fsdp: "full_shard auto_wrap"
  fsdp_config:
    backward_prefetch: backward_pre
    forward_prefetch: true
    cpu_ram_efficient_loading: true
    sync_module_states: true
    transformer_layer_cls_to_wrap:
      - LlamaDecoderLayer
    use_orig_params: true
    activation_checkpointing: true
  save_safetensors: true
